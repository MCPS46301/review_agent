name: Deploy to Vercel

on:
  push:
    branches: [claude/review-auto-responder-app-oXU2g]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          vercel deploy \
            --token "$VERCEL_TOKEN" \
            --prod \
            --yes \
            --name macomb-reviews \
            --env DATABASE_URL='postgresql://postgres:changeme2026%21%24%24@db.aarysgprbhdiggjtqoif.supabase.co:5432/postgres' \
            --env BUSINESS_NAME='Macomb Powersports' \
            --env BUSINESS_OWNER_NAME='Lloyd' \
            --env BUSINESS_OWNER_EMAIL='lloyd@macombpowersports.com' \
            --env SMTP_HOST='smtp.gmail.com' \
            --env SMTP_PORT='587' \
            --env SMTP_USE_TLS='true' \
            --env YELP_BUSINESS_ID='macomb-powersports-macomb' \
            --env CRON_SECRET='macombps2026secure' \
            --env POLL_INTERVAL_MINUTES='15' \
            --env APP_BASE_URL='https://macomb-reviews.vercel.app' \
            --env ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" \
            --env SMTP_USERNAME="$SMTP_USERNAME" \
            --env SMTP_FROM_EMAIL="$SMTP_USERNAME" \
            --env SMTP_PASSWORD="$SMTP_PASSWORD"
