name: Deploy to Vercel

on:
  push:
    branches: [claude/review-auto-responder-app-oXU2g]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test Vercel token
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          echo "Token length: ${#VERCEL_TOKEN}"
          curl -sf -H "Authorization: Bearer $VERCEL_TOKEN" https://api.vercel.com/v2/user \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print('Logged in as:', d['user']['name'], d['user']['email'])" \
            || echo "TOKEN INVALID or API unreachable"

      - name: Install Vercel CLI and deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm install -g vercel@latest
          vercel deploy --token "$VERCEL_TOKEN" --prod --yes 2>&1
